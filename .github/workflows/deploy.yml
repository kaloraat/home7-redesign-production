name: Deploy to production

# Runs on every push to main — SSHs into the droplet and runs the same
# deploy.sh you can also run by hand there. Nothing here handles env vars
# (see deploy.sh's own comment for why) — this only automates pulling code,
# installing dependencies, building, and restarting the running app.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH in and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: ~/home7-redesign/deploy.sh
